name: CEREBRON BUILD-064 Recursive Strassen 4x4
'on':
  push:
    paths:
      - .github/workflows/saphea-build064-strassen-4x4.yml
  workflow_dispatch:
jobs:
  recursive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify 64-to-49 recursive reduction
        run: |
          python - <<'PY'
          import json,os,random

          def add(A,B): return [[A[i][j]+B[i][j] for j in range(len(A))] for i in range(len(A))]
          def sub(A,B): return [[A[i][j]-B[i][j] for j in range(len(A))] for i in range(len(A))]
          def classical(A,B):
              n=len(A)
              return [[sum(A[i][k]*B[k][j] for k in range(n)) for j in range(n)] for i in range(n)]

          def s2(A,B):
              a,b=A[0];c,d=A[1];e,f=B[0];g,h=B[1]
              m1=(a+d)*(e+h);m2=(c+d)*e;m3=a*(f-h);m4=d*(g-e)
              m5=(a+b)*h;m6=(c-a)*(e+f);m7=(b-d)*(g+h)
              return [[m1+m4-m5+m7,m3+m5],[m2+m4,m1-m2+m3+m6]],7

          def split(M):
              return ([[M[i][j] for j in range(2)] for i in range(2)],
                      [[M[i][j] for j in range(2,4)] for i in range(2)],
                      [[M[i][j] for j in range(2)] for i in range(2,4)],
                      [[M[i][j] for j in range(2,4)] for i in range(2,4)])
          def join(A,B,C,D): return [A[i]+B[i] for i in range(2)]+[C[i]+D[i] for i in range(2)]

          def s4(A,B):
              a,b,c,d=split(A);e,f,g,h=split(B)
              p1,n1=s2(add(a,d),add(e,h));p2,n2=s2(add(c,d),e)
              p3,n3=s2(a,sub(f,h));p4,n4=s2(d,sub(g,e))
              p5,n5=s2(add(a,b),h);p6,n6=s2(sub(c,a),add(e,f));p7,n7=s2(sub(b,d),add(g,h))
              C11=add(sub(add(p1,p4),p5),p7);C12=add(p3,p5)
              C21=add(p2,p4);C22=add(sub(add(p1,p3),p2),p6)
              return join(C11,C12,C21,C22),sum([n1,n2,n3,n4,n5,n6,n7])

          rng=random.Random(64026)
          cases=[]
          for _ in range(100):
              A=[[rng.randint(-20,20) for _ in range(4)] for _ in range(4)]
              B=[[rng.randint(-20,20) for _ in range(4)] for _ in range(4)]
              cases.append((A,B))
          rows=[];ok=True
          for i,(A,B) in enumerate(cases):
              ref=classical(A,B); got,n=s4(A,B)
              passed=(ref==got and n==49)
              ok &= passed
              rows.append({"case":i,"scalar_mult":n,"pass":passed})
          out={"build":"064","matrix_size":"4x4","cases":100,"passed":sum(x["pass"] for x in rows),
               "classical_scalar_mult":64,"recursive_strassen_scalar_mult":49,
               "status":"RECURSIVE_4X4_PASS" if ok else "RECURSIVE_4X4_FAIL","results":rows}
          os.makedirs("result",exist_ok=True);open("result/result.json","w").write(json.dumps(out,indent=2))
          print(json.dumps({k:v for k,v in out.items() if k!="results"}))
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build064-strassen-4x4
          path: result/result.json
