name: CEREBRON BUILD-060 SAPHEA Final Channel
'on':
  push:
    paths:
      - .github/workflows/saphea-build060-qwen-final-channel.yml
  workflow_dispatch:
jobs:
  final-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip -q install transformers torch sentencepiece
      - name: Disable thinking for concise canonical answer
        run: |
          python - <<'PY'
          import json,os,re
          from transformers import AutoTokenizer,AutoModelForCausalLM
          m="Qwen/Qwen3-1.7B"
          t=AutoTokenizer.from_pretrained(m); model=AutoModelForCausalLM.from_pretrained(m)
          msg=[{"role":"user","content":"CANONICAL pressure_Pa=2500000 VERIFIED. In one sentence of at most 16 words, state the value and its physical meaning. Do not recalculate."}]
          try:
            p=t.apply_chat_template(msg,tokenize=False,add_generation_prompt=True,enable_thinking=False)
          except TypeError:
            p=t.apply_chat_template(msg,tokenize=False,add_generation_prompt=True)
          z=t(p,return_tensors="pt")
          y=model.generate(**z,max_new_tokens=40,do_sample=False,pad_token_id=t.eos_token_id)
          raw=t.decode(y[0][z["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          final=raw.split("</think>")[-1].strip() if "</think>" in raw else raw
          words=re.findall(r"\S+",final)
          exact="2500000" in final.replace(",","").replace(" ","")
          no_think="<think>" not in final.lower()
          concise=0<len(words)<=16
          ok=exact and no_think and concise
          out={"build":"060","population":"SAPHEA","model":m,"raw":raw,"final":final,"words":len(words),"canonical_preserved":exact,"thinking_hidden":no_think,"concise":concise,"status":"FINAL_CHANNEL_PASS" if ok else "FINAL_CHANNEL_FAIL"}
          os.makedirs("result",exist_ok=True);open("result/result.json","w").write(json.dumps(out,indent=2));print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build060-saphea-final-channel
          path: result/result.json
