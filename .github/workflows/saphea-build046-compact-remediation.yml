name: CEREBRON SAPHEA BUILD-046 Compact Remediation
'on':
  push:
    paths:
      - .github/workflows/saphea-build046-compact-remediation.yml
  workflow_dispatch:
jobs:
  remediate:
    strategy:
      fail-fast: false
      matrix:
        student:
          - SAPHEA
          - SAPHIDE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: pip -q install transformers torch sentencepiece
      - name: Execute compact remediation
        env:
          STUDENT: ${{ matrix.student }}
        run: |
          python - <<'PY'
          import os,json,hashlib
          from transformers import AutoTokenizer,AutoModelForCausalLM
          s=os.environ["STUDENT"]
          m="Qwen/Qwen3-1.7B" if s=="SAPHEA" else "HuggingFaceTB/SmolLM2-1.7B-Instruct"
          prompt="Lesson: one square millimetre equals 1e-6 square metre. Pressure equals force divided by area. Base SI pressure dimension is kg m^-1 s^-2. Calculate first and answer compactly. New exam: force 2.4 kN, area 600 square millimetres. Give force N, area m2, pressure Pa, dimension. One short line."
          t=AutoTokenizer.from_pretrained(m)
          model=AutoModelForCausalLM.from_pretrained(m)
          z=t(prompt,return_tensors="pt")
          y=model.generate(**z,max_new_tokens=48,do_sample=False)
          out=t.decode(y[0][z["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          low=out.lower().replace(",","").replace(" ","")
          checks=dict(force=("2400" in low or "2.4e3" in low),area=("0.0006" in low or "6e-4" in low),pressure=("4000000" in low or "4e6" in low),dimension=("kg" in low and "m" in low and "s" in low),compact=(len(out)<220))
          status="AUDITOR_REQUIRED" if all(checks.values()) else "GPT_MENTOR_REQUIRED"
          rec={"student":s,"model":m,"state":"EXECUTED","output":out,"checks":checks,"status":status}
          rec["sha256"]=hashlib.sha256(out.encode()).hexdigest()
          os.makedirs("result",exist_ok=True)
          open("result/result.json","w").write(json.dumps(rec,indent=2))
          print(json.dumps({"student":s,"checks":checks,"status":status}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build046-${{ matrix.student }}
          path: result/result.json
  gate:
    needs: remediate
    runs-on: ubuntu-latest
    steps:
      - run: echo SAPHEA_BUILD_046_COMPLETE
