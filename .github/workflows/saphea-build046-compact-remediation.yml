name: CEREBRON SAPHEA BUILD-046 Compact Reasoning Remediation
'on':
  push:
    paths:
      - .github/workflows/saphea-build046-compact-remediation.yml
  workflow_dispatch:
jobs:
  remediate:
    strategy:
      fail-fast: false
      matrix:
        student:
          - SAPHEA
          - SAPHIDE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install transformers torch sentencepiece
      - name: Compact remediation exam
        env:
          STUDENT: ${{ matrix.student }}
        run: |
          python - <<'PY'
          import os,json,hashlib,re
          from transformers import AutoTokenizer,AutoModelForCausalLM
          s=os.environ["STUDENT"]
          m="Qwen/Qwen3-1.7B" if s=="SAPHEA" else "HuggingFaceTB/SmolLM2-1.7B-Instruct"
          mentor="""MENTOR REMEDIATION C01:
Square-unit conversion: 1 mm = 1e-3 m, so 1 mm^2 = 1e-6 m^2.
Example correction: 800 mm^2 = 800e-6 = 0.0008 m^2.
Pressure p=F/A. 3200/0.0008=4e6 Pa.
Base SI pressure dimension: kg*m^-1*s^-2.
MICRO-SKILL: calculate first; output only requested compact fields. No explanation unless asked."""
          exam="""NEW UNSEEN EXAM: F=2.4 kN, A=600 mm^2.
Output EXACTLY one glyph line:
G:F=<N>;G:A=<m2>;D:P=<Pa>;D:DIM=kg*m^-1*s^-2"""
          t=AutoTokenizer.from_pretrained(m); model=AutoModelForCausalLM.from_pretrained(m)
          z=t(mentor+"\n"+exam,return_tensors="pt")
          y=model.generate(**z,max_new_tokens=48,do_sample=False)
          out=t.decode(y[0][z["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          low=out.lower().replace(",","").replace(" ","")
          checks={"force":("2400" in low or "2.4e3" in low),
                  "area":("0.0006" in low or "6e-4" in low),
                  "pressure":("4000000" in low or "4e6" in low),
                  "dimension":("kg" in low and "m" in low and "s" in low),
                  "compact":len(out.splitlines())<=2 and len(out)<220}
          ok=all(checks.values())
          rec={"student":s,"model":m,"lesson":"C01_COMPACT_REMEDIATION","state":"EXECUTED",
               "output":out,"checks":checks,"status":"AUDITOR_REQUIRED" if ok else "GPT_MENTOR_REQUIRED"}
          rec["sha256"]=hashlib.sha256(out.encode()).hexdigest()
          os.makedirs("remediation",exist_ok=True);open("remediation/result.json","w").write(json.dumps(rec,indent=2))
          print(json.dumps({"student":s,"checks":checks,"status":rec["status"]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: remediation-C01-${{ matrix.student }}
          path: remediation/result.json
  gate:
    needs: remediate
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "CALCULATE_FIRST=TRUE"
          echo "COMPACT_GLYPH_OUTPUT=TRUE"
          echo "UNSEEN_RETRY=TRUE"
          echo "AUDITOR_REQUIRED=TRUE"
          echo "SAPHEA_BUILD_046_COMPACT_REMEDIATION_COMPLETE"
