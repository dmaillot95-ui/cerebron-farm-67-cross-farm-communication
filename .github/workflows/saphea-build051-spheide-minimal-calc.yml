name: CEREBRON BUILD-051 SPHEIDE Minimal Calc
'on':
  push:
    paths:
      - .github/workflows/saphea-build051-spheide-minimal-calc.yml
  workflow_dispatch:
jobs:
  minimal-calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install transformers torch sentencepiece
      - name: SPHEIDE minimal calculation
        run: |
          python - <<'PY'
          import json,os,hashlib
          from transformers import AutoTokenizer,AutoModelForCausalLM
          m="HuggingFaceTB/SmolLM2-1.7B-Instruct"
          t=AutoTokenizer.from_pretrained(m)
          model=AutoModelForCausalLM.from_pretrained(m)
          messages=[{"role":"user","content":"Calculate 3600 divided by 0.0009. Reply with the number only."}]
          prompt=t.apply_chat_template(messages,tokenize=False,add_generation_prompt=True)
          z=t(prompt,return_tensors="pt")
          y=model.generate(**z,max_new_tokens=32,do_sample=False,pad_token_id=t.eos_token_id)
          out=t.decode(y[0][z["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          low=out.replace(",","").replace(" ","")
          ok=("4000000" in low or "4e6" in low.lower() or "4.0e6" in low.lower())
          rec={"build":"051","population":"SPHEIDE","model":m,"task":"3600/0.0009","output":out,"numeric_pass":ok,"status":"MINIMAL_CALC_PASS" if ok else "MINIMAL_CALC_FAIL"}
          rec["sha256"]=hashlib.sha256(out.encode()).hexdigest()
          os.makedirs("result",exist_ok=True)
          open("result/result.json","w").write(json.dumps(rec,indent=2))
          print(json.dumps(rec))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build051-SPHEIDE
          path: result/result.json
