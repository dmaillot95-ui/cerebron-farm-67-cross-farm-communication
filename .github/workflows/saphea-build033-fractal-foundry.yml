name: CEREBRON SAPHEA BUILD-033 Fractal Foundry
on:
  push:
    paths: ['worker/fractal_foundry.py','tests/test_fractal_foundry.py','.github/workflows/saphea-build033-fractal-foundry.yml']
  workflow_dispatch:
jobs:
  fractal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python tests/test_fractal_foundry.py
