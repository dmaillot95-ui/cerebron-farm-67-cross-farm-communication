name: CEREBRON BUILD-065 Multiplication Claim Verifier
on:
  push:
    paths:
      - '.github/workflows/saphea-build065-multiplication-claim-verifier.yml'
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify explicit multiplication counts
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          import os

          cases = [
              ("valid7", "x=a*b\ny=c*d\nz=e*f\nu=g*h\nv=a*c\nw=b*d\nq=e*g", 7, True),
              ("hidden8", "x=a*b\ny=c*d\nz=e*f\nu=g*h\nv=a*c\nw=b*d\nq=e*g\nr=f*h", 7, False),
              ("nested", "x=(a*b)*(b+c)", 1, False),
              ("zero", "x=a+b-c", 0, True),
          ]

          def count_mult(source):
              tree = ast.parse(source)
              return sum(
                  1 for node in ast.walk(tree)
                  if isinstance(node, ast.BinOp) and isinstance(node.op, ast.Mult)
              )

          rows = []
          for name, source, claim, expected in cases:
              actual = count_mult(source)
              accepted = actual <= claim
              rows.append({
                  "name": name,
                  "claimed": claim,
                  "actual": actual,
                  "accepted": accepted,
                  "expected": expected,
                  "pass": accepted == expected,
              })

          passed = sum(row["pass"] for row in rows)
          result = {
              "build": "065R",
              "tests": len(rows),
              "passed": passed,
              "status": "CLAIM_VERIFIER_PASS" if passed == len(rows) else "CLAIM_VERIFIER_FAIL",
              "limitations": [
                  "Counts explicit Python AST multiplication nodes only",
                  "Does not inspect multiplication hidden in called functions",
                  "Does not prove bilinear rank or minimality"
              ],
              "cases": rows,
          }
          os.makedirs("result", exist_ok=True)
          with open("result/result.json", "w") as fh:
              json.dump(result, fh, indent=2)
          print(json.dumps(result))
          if passed != len(rows):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build065r-multiplication-claim-verifier
          path: result/result.json
