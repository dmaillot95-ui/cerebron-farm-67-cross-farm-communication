name: CEREBRON SAPHEA BUILD-025 Glyph Vector
on:
  push:
    paths:
      - 'worker/glyph_vector.py'
      - 'tests/test_glyph_vector.py'
      - '.github/workflows/saphea-build025-glyph-vector.yml'
  workflow_dispatch:
jobs:
  glyph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python tests/test_glyph_vector.py
