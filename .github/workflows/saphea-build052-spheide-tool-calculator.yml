name: CEREBRON BUILD-052 SPHEIDE Tool Calculator
'on':
  push:
    paths:
      - .github/workflows/saphea-build052-spheide-tool-calculator.yml
  workflow_dispatch:
jobs:
  tool-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install transformers torch sentencepiece
      - name: SPHEIDE plus deterministic calculator
        run: |
          python - <<'PY'
          import json,os,hashlib
          from transformers import AutoTokenizer,AutoModelForCausalLM
          m="HuggingFaceTB/SmolLM2-1.7B-Instruct"
          force=3600.0
          area=0.0009
          pressure=force/area
          tool={"force_N":force,"area_m2":area,"pressure_Pa":pressure}
          t=AutoTokenizer.from_pretrained(m)
          model=AutoModelForCausalLM.from_pretrained(m)
          messages=[{"role":"user","content":f"Trusted calculator result: {json.dumps(tool)}. Report these values in one short line. Do not recalculate."}]
          prompt=t.apply_chat_template(messages,tokenize=False,add_generation_prompt=True)
          z=t(prompt,return_tensors="pt")
          y=model.generate(**z,max_new_tokens=48,do_sample=False,pad_token_id=t.eos_token_id)
          out=t.decode(y[0][z["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          low=out.replace(",","").replace(" ","")
          checks={"tool_exact":pressure==4000000.0,"reports_force":"3600" in low,"reports_area":("0.0009" in low or "9e-4" in low),"reports_pressure":("4000000" in low or "4e6" in low.lower())}
          rec={"build":"052","population":"SPHEIDE","model":m,"calculator":tool,"output":out,"checks":checks,"status":"TOOL_AUGMENTED_PASS" if all(checks.values()) else "TOOL_AUGMENTED_FAIL"}
          rec["sha256"]=hashlib.sha256(out.encode()).hexdigest()
          os.makedirs("result",exist_ok=True)
          open("result/result.json","w").write(json.dumps(rec,indent=2))
          print(json.dumps(rec))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build052-SPHEIDE
          path: result/result.json
