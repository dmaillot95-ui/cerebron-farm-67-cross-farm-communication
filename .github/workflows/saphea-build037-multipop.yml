name: CEREBRON SAPHEA BUILD-037 Multi Population Crystal
on:
  push:
    paths: ['.github/workflows/saphea-build037-multipop.yml']
  workflow_dispatch:
jobs:
  population:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pop: SAPHEA, model: "Qwen/Qwen3-1.7B", lane: DERIVE}
          - {pop: SAPHEA, model: "Qwen/Qwen3-1.7B", lane: FALSIFY}
          - {pop: SAPHEA, model: "Qwen/Qwen3-1.7B", lane: VERIFY}
          - {pop: SAPHIDE, model: "HuggingFaceTB/SmolLM2-1.7B-Instruct", lane: DERIVE}
          - {pop: SAPHIDE, model: "HuggingFaceTB/SmolLM2-1.7B-Instruct", lane: FALSIFY}
          - {pop: SAPHIDE, model: "HuggingFaceTB/SmolLM2-1.7B-Instruct", lane: VERIFY}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip -q install transformers torch sentencepiece
      - name: Execute population member
        env:
          POP: ${{ matrix.pop }}
          MODEL: ${{ matrix.model }}
          LANE: ${{ matrix.lane }}
        run: |
          python - <<'PY'
          import os,json,hashlib
          from transformers import AutoTokenizer,AutoModelForCausalLM
          pop,mid,lane=os.environ["POP"],os.environ["MODEL"],os.environ["LANE"]
          problem="A shaft delivers torque 120 N*m at 1500 rpm. Compute mechanical power and state whether adequacy can be concluded without required-load evidence."
          prompt=f"{pop} {lane}. {problem} No invented specifications. UNKNOWN remains UNKNOWN. Max 5 short lines."
          tok=AutoTokenizer.from_pretrained(mid)
          model=AutoModelForCausalLM.from_pretrained(mid)
          inp=tok(prompt,return_tensors="pt")
          out=model.generate(**inp,max_new_tokens=100,do_sample=False)
          txt=tok.decode(out[0][inp["input_ids"].shape[1]:],skip_special_tokens=True)
          rec={"population":pop,"model":mid,"lane":lane,"state":"EXECUTED","output":txt}
          rec["sha256"]=hashlib.sha256(txt.encode()).hexdigest()
          os.makedirs("multipop",exist_ok=True)
          open(f"multipop/{pop}_{lane}.json","w").write(json.dumps(rec,indent=2))
          print(json.dumps({k:rec[k] for k in ["population","model","lane","state","sha256"]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pop }}-${{ matrix.lane }}
          path: multipop/*.json
  crystal-gate:
    needs: population
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "POPULATIONS=2"
          echo "REAL_MODEL_CALLS_REQUESTED=6"
          echo "SAME_PROBLEM_DIFFERENT_MODEL_FAMILIES=TRUE"
          echo "MODEL_DIVERSITY!=INDEPENDENT_PROOF"
          echo "SAPHEA_BUILD_037_MULTIPOP_CRYSTAL_COMPLETE"
