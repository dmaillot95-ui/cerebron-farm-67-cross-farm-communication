name: CEREBRON SAPHEA BUILD-048 Inference Interface
'on':
  push:
    paths:
      - .github/workflows/saphea-build048-inference-interface.yml
  workflow_dispatch:
jobs:
  interface-test:
    strategy:
      fail-fast: false
      matrix:
        student:
          - SAPHEA
          - SAPHIDE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install transformers torch sentencepiece
      - name: Test native chat interface
        env:
          STUDENT: ${{ matrix.student }}
        run: |
          python - <<'PY'
          import os,json,hashlib
          from transformers import AutoTokenizer,AutoModelForCausalLM
          s=os.environ["STUDENT"]
          m="Qwen/Qwen3-1.7B" if s=="SAPHEA" else "HuggingFaceTB/SmolLM2-1.7B-Instruct"
          t=AutoTokenizer.from_pretrained(m)
          model=AutoModelForCausalLM.from_pretrained(m)
          messages=[
            {"role":"system","content":"You are a compact calculation student. Solve only the current question. Do not repeat examples or instructions. Answer one line only."},
            {"role":"user","content":"Force is 3.6 kN and area is 900 mm2. Compute pressure. Output exactly four values: force_N; area_m2; pressure_Pa; pressure_dimension."}
          ]
          if hasattr(t,"apply_chat_template") and t.chat_template:
            prompt=t.apply_chat_template(messages,tokenize=False,add_generation_prompt=True)
          else:
            prompt="SYSTEM: "+messages[0]["content"]+"\nUSER: "+messages[1]["content"]+"\nASSISTANT:"
          z=t(prompt,return_tensors="pt")
          y=model.generate(**z,max_new_tokens=64,do_sample=False,pad_token_id=t.eos_token_id)
          out=t.decode(y[0][z["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          low=out.lower().replace(",","").replace(" ","")
          checks={"force":"3600" in low,"area":("0.0009" in low or "9e-4" in low),"pressure":("4000000" in low or "4e6" in low),"dimension":("kg" in low and "m" in low and "s" in low)}
          rec={"build":"048","student":s,"model":m,"native_chat_template":bool(getattr(t,"chat_template",None)),"output":out,"checks":checks,"status":"INTERFACE_PASS" if all(checks.values()) else "INTERFACE_FAIL"}
          rec["sha256"]=hashlib.sha256(out.encode()).hexdigest()
          os.makedirs("result",exist_ok=True)
          open("result/result.json","w").write(json.dumps(rec,indent=2))
          print(json.dumps(rec))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build048-${{ matrix.student }}
          path: result/result.json
