name: CEREBRON SAPHEA BUILD-030 Checkpoint Harvester
on:
  push:
    paths: ['worker/checkpoint_harvester.py','tests/test_checkpoint_harvester.py','.github/workflows/saphea-build030-harvester.yml']
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python tests/test_checkpoint_harvester.py
