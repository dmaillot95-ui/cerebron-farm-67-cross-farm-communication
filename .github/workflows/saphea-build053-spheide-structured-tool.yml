name: CEREBRON BUILD-053 SPHEIDE Structured Tool
'on':
  push:
    paths:
      - .github/workflows/saphea-build053-spheide-structured-tool.yml
  workflow_dispatch:
jobs:
  structured-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install transformers torch sentencepiece
      - name: Structured tool to SPHEIDE
        run: |
          python - <<'PY'
          import json,os,hashlib
          from transformers import AutoTokenizer,AutoModelForCausalLM
          m="HuggingFaceTB/SmolLM2-1.7B-Instruct"
          tool={"schema":"CEREBRON_TOOL_RESULT_V1","force_N":3600,"area_m2":0.0009,"pressure_Pa":4000000,"dimension":"kg*m^-1*s^-2","verified":True}
          canonical=json.dumps(tool,separators=(",",":"))
          t=AutoTokenizer.from_pretrained(m)
          model=AutoModelForCausalLM.from_pretrained(m)
          messages=[{"role":"user","content":"Read this verified machine record. Do not calculate and do not modify values. Return only the pressure_Pa value. RECORD="+canonical}]
          prompt=t.apply_chat_template(messages,tokenize=False,add_generation_prompt=True)
          z=t(prompt,return_tensors="pt")
          y=model.generate(**z,max_new_tokens=24,do_sample=False,pad_token_id=t.eos_token_id)
          out=t.decode(y[0][z["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          normalized=out.replace(",","").replace(" ","")
          pass_read=("4000000" in normalized or "4e6" in normalized.lower())
          rec={"build":"053","population":"SPHEIDE","model":m,"tool_record":tool,"model_output":out,"read_exact_value":pass_read,"status":"STRUCTURED_READ_PASS" if pass_read else "STRUCTURED_READ_FAIL","rule":"TOOL_RECORD_IS_CANONICAL_MODEL_OUTPUT_IS_NOT"}
          rec["sha256"]=hashlib.sha256(out.encode()).hexdigest()
          os.makedirs("result",exist_ok=True)
          open("result/result.json","w").write(json.dumps(rec,indent=2))
          print(json.dumps(rec))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build053-SPHEIDE
          path: result/result.json
